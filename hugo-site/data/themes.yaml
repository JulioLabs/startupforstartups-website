# Free website themes shown on /themes/. Source: github.com/JulioLabs/presencewave-themes (one folder per industry).
# Images: static/assets/images/themes/<industry>/<theme>.webp (the theme's preview, resized).
# Download: the latest release's <industry>-<theme>.zip. Live preview: GitHub Pages of the themes repo.
