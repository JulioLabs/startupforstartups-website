# Homepage hero slider: one slide per service, each on a different demo business in its own brand.
# Images are in static/assets/images/home-hero/: <id>-site-960/1440.webp (the browser) and <id>-phone.webp.
# They come from the industry showcases, plus ~/Work/presencewave/homepage-hero/ (scripts/e2e/home_hero_shots.py
# in the app repo) for the quote form and links widget.
# pins: x/y are the dot's position on the browser screenshot, in % of its width/height;
# side is where the label sits next to the dot (l or r).
# snippet: true for slides that show widgets on the business's own website (adds "1 snippet" to the address bar).
slides:
  - id: widgets
    snippet: true
    tab: Website widgets
    icon: fa-puzzle-piece
    title: Offers, polls, feedback and a cookie notice, from one snippet
    business: Greenstripe Lawn Co.
    kind: Lawn care
    theme: Fairway
    site_label: greenstripe — home page
    site_alt: Greenstripe Lawn Co.'s home page with a PresenceWave seasonal offer banner, quick poll, feedback tab and cookie notice
    phone: The same widgets on a phone
    phone_alt: Greenstripe's home page on a phone, with the offer banner and feedback tab
    showcase: /showcase/lawn-care/
    pins:
      - { label: Offer banner, x: 3, y: 4, side: r }
      - { label: Quick poll, x: 76, y: 66, side: l }
      - { label: Feedback tab, x: 90, y: 86, side: l }
      - { label: Cookie notice, x: 3, y: 95, side: r }
  - id: quote-forms
    snippet: true
    tab: Quote forms
    icon: fa-file-signature
    title: A request form that sorts the urgent from the routine
    business: Copperline Home Services
    kind: Plumbing, heating and electrical
    theme: Dispatch
    site_label: copperline — request service
    site_alt: Copperline Home Services' request section with a PresenceWave form asking what's needed, how urgent it is and the ZIP code
    phone: The form on a phone
    phone_alt: Copperline's request form on a phone
    showcase: /showcase/home-services/
    pins:
      - { label: Form widget, x: 48.4, y: 60, side: l }
  - id: nps-surveys
    tab: NPS surveys
    icon: fa-star-half-stroke
    title: An NPS survey for every new member
    business: Pulsehouse Fitness
    kind: Fitness studio
    theme: Afterburn
    site_label: pulsehouse — first-month check-in
    site_alt: Pulsehouse Fitness's first-month check-in asking how likely the member is to recommend Pulsehouse, on a 0 to 10 scale
    phone: The survey on a phone
    phone_alt: Pulsehouse's survey on a phone, with 9 chosen on the 0 to 10 scale
    showcase: /showcase/fitness-studios/
    pins:
      - { label: NPS question, x: 16.5, y: 49, side: l }
  - id: blog
    tab: Blog
    icon: fa-newspaper
    title: A blog on your own domain, in your brand
    business: Havenly Home Care
    kind: Cleaning
    theme: ""
    site_label: havenly — blog
    site_alt: The Havenly Journal, Havenly Home Care's blog, with its latest posts
    phone: The blog on a phone
    phone_alt: The Havenly Journal on a phone
    showcase: /showcase/cleaning-services/
    pins: []
  - id: links
    snippet: true
    tab: Links
    icon: fa-link
    title: A links page for your bios, and inside your website
    business: Wayfarer Journeys
    kind: Small-group travel
    theme: Getaway Club
    site_label: wayfarer — home page
    site_alt: Wayfarer Journeys' home page with its links page embedded as a PresenceWave links widget
    phone: The links page on its own address
    phone_alt: Wayfarer's links page on a phone
    showcase: /showcase/group-tours/
    pins:
      - { label: Links widget, x: 17.8, y: 45, side: r }
