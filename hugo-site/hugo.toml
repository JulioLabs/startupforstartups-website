baseURL = 'https://presencewave.com'
languageCode = 'en-us'
title = 'PresenceWave - Grow Your Business Online'
theme = 'startup-theme'

# Page lastmod (used in sitemap.xml) comes from each page's last git commit
enableGitInfo = true

# No tag or category pages: the site has no taxonomies, and the empty list pages were indexable
disableKinds = ['taxonomy', 'term']

# Enable unsafe HTML in markdown (needed for custom HTML in content)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = false
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"

# Configure menus for navigation
[menu]
  [[menu.main]]
    name = "How it Works"
    url = "/#how"
    weight = 10

  [[menu.main]]
    name = "Tools"
    url = "/#tools"
    weight = 20

  [[menu.main]]
    name = "Industries"
    url = "/#industries"
    weight = 25

  [[menu.main]]
    name = "Pricing"
    url = "/pricing/"
    weight = 28

  [[menu.main]]
    name = "Get Started"
    url = "https://app.presencewave.com"
    weight = 30

# Site parameters
[params]
  description = "PresenceWave helps local businesses, SaaS companies and online stores capture leads, hear from customers and bring them back - all from one platform, on your own domain."

  # Footer configuration
  [params.footer]
    copyright = "Julio Labs (OPC) Pvt. Ltd. All rights reserved."

  # Social links
  [params.social]
    twitter = "https://twitter.com/presence_wave"
    blog = "https://blog.presencewave.com"

# Output formats for different content types
[outputs]
  home = ["HTML", "RSS", "llms", "llmsfull"]
  page = ["HTML"]

# /llms.txt (a guide to the site for AI assistants and agents) and /llms-full.txt (the same plus the full docs text),
# generated from the pages so they stay current: layouts/index.llms.txt and layouts/index.llmsfull.txt
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true

# SEO and meta configuration
[params.seo]
  title = "PresenceWave - Grow Your Business Online"
  description = "PresenceWave helps local businesses, SaaS companies and online stores capture leads, hear from customers and bring them back - all from one platform, on your own domain."
  image = "/assets/images/og-default.jpg"
