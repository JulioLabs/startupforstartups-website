baseURL = 'https://presencewave.com'
languageCode = 'en-us'
title = 'PresenceWave - Grow Your Local Service Business Online'
theme = 'startup-theme'

# Enable unsafe HTML in markdown (needed for custom HTML in content)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = false
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"

# Configure menus for navigation
[menu]
  [[menu.main]]
    name = "How it Works"
    url = "/#how"
    weight = 10

  [[menu.main]]
    name = "Tools"
    url = "/#tools"
    weight = 20

  [[menu.main]]
    name = "Industries"
    url = "/#industries"
    weight = 25

  [[menu.main]]
    name = "Get Started"
    url = "https://app.presencewave.com"
    weight = 30

# Site parameters
[params]
  description = "PresenceWave helps local service businesses - cleaning, landscaping, electricians, dentists and more - capture more leads, understand their customers and bring them back, all from one platform."

  # Footer configuration
  [params.footer]
    copyright = "Julio Labs (OPC) Pvt. Ltd. All rights reserved."

  # Social links
  [params.social]
    twitter = "https://twitter.com/get_s4s"
    blog = "https://blog.presencewave.com"

# Output formats for different content types
[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]

# SEO and meta configuration
[params.seo]
  title = "PresenceWave - Grow Your Local Service Business Online"
  description = "PresenceWave helps local service businesses - cleaning, landscaping, electricians, dentists and more - capture more leads, understand their customers and bring them back, all from one platform."
  image = "/assets/images/heroimage.png"
